<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras | Luis Buittons</title>

    <!--BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!--Links CSS | Favicon -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/font.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <!-- HEADER PADRÃO DO GRUPO -->
    <header class="header">
        <div class="header-grid">
            <hgroup>
                <h1>Luis Buittons</h1>
            </hgroup>

            <nav class="nav">
                <div class="nav-links">
                    <ul>
                        <li><a href="index.html">Início</a></li>
                        <li><a href="masculino.html">Masculino</a></li>
                        <li><a href="feminino.html">Feminino</a></li>
                        <li><a href="acessorios.html">Acessórios</a></li>
                        <li><a href="sobre.html">Sobre nós</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </div>

                <div class="nav-actions">
                    <ul>
                        <li><a href="#" class="text-dark"><i class="fa-solid fa-heart"></i></a></li>
                        <li><a href="carrinho.html" class="text-dark"><i class="fa-solid fa-cart-shopping"></i></a></li>
                        <li><a href="login.html" class="text-dark"><i class="fa-solid fa-user"></i></a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="container py-5 mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 style="font-family: 'Playfair Display', serif;" class="border-bottom pb-3">Seu Carrinho</h2>
            </div>
        </div>

        <div class="row">
            <!-- LISTA DE PRODUTOS NO CARRINHO (Esquerda) -->
            <div class="col-lg-8 mb-4">
                <div class="card border-0 shadow-sm p-4">
                    <div id="carrinho-vazio" class="text-center py-5 d-none">
                        <i class="fa-solid fa-cart-shopping fa-3x text-muted mb-3"></i>
                        <h5>Seu carrinho está vazio</h5>
                        <p class="text-muted">Adicione produtos para continuar comprando.</p>
                        <a href="feminino.html" class="btn btn-dark mt-2">Continuar Comprando</a>
                    </div>

                    <div id="lista-produtos">
                        <!-- Os produtos serão gerados aqui pelo JavaScript -->
                    </div>
                </div>
            </div>

            <!-- RESUMO DO PEDIDO (Direita) -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 bg-light">
                    <h5 class="mb-4" style="font-family: 'Playfair Display', serif;">Resumo do Pedido</h5>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span id="resumo-subtotal" class="fw-bold">R$ 0,00</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span class="text-muted">Frete (Cortesia)</span>
                        <span class="text-success fw-bold">Grátis</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total</span>
                        <span id="resumo-total" class="fw-bold fs-5">R$ 0,00</span>
                    </div>
                    
                    <!-- Leva para a página da Regina -->
                    <a href="checkout.html" class="btn btn-dark w-100 text-uppercase py-2" style="letter-spacing: 1px;" id="btn-finalizar">Finalizar Compra</a>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT DO CARRINHO (Lógica do Front-end) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // PRODUTO MOCK (Apenas para você conseguir visualizar a página funcionando)
            // Se o carrinho estiver vazio, injetamos um produto de teste
            if (!localStorage.getItem('carrinhoBuittons') || JSON.parse(localStorage.getItem('carrinhoBuittons')).length === 0) {
                const produtoTeste = [{
                    id: '1',
                    nome: 'Vestido Midi em Seda',
                    preco: 890.00,
                    quantidade: 1,
                    imagem: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'
                }];
                localStorage.setItem('carrinhoBuittons', JSON.stringify(produtoTeste));
            }

            renderizarCarrinho();
        });

        // Função para formatar moeda (R$)
        const formatarMoeda = (valor) => {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // Função principal que lê o localStorage e monta a tela
        function renderizarCarrinho() {
            const carrinhoSalvo = localStorage.getItem('carrinhoBuittons');
            let carrinho = carrinhoSalvo ? JSON.parse(carrinhoSalvo) : [];
            
            const containerProdutos = document.getElementById('lista-produtos');
            const containerVazio = document.getElementById('carrinho-vazio');
            const btnFinalizar = document.getElementById('btn-finalizar');
            
            containerProdutos.innerHTML = ''; // Limpa a lista antes de desenhar
            let valorTotal = 0;

            if (carrinho.length === 0) {
                containerVazio.classList.remove('d-none');
                btnFinalizar.classList.add('disabled');
            } else {
                containerVazio.classList.add('d-none');
                btnFinalizar.classList.remove('disabled');

                // Percorre os produtos salvos e cria o HTML para cada um
                carrinho.forEach((produto, index) => {
                    const subtotalProduto = produto.preco * produto.quantidade;
                    valorTotal += subtotalProduto;

                    containerProdutos.innerHTML += `
                        <div class="row align-items-center mb-4 border-bottom pb-3">
                            <div class="col-3 col-md-2">
                                <img src="${produto.imagem}" alt="${produto.nome}" class="img-fluid rounded">
                            </div>
                            <div class="col-9 col-md-4 mb-2 mb-md-0">
                                <h6 class="mb-1">${produto.nome}</h6>
                                <span class="text-muted small">Ref: LB-${produto.id}00${index}</span>
                            </div>
                            <div class="col-6 col-md-3 text-center">
                                <div class="input-group input-group-sm w-75 mx-auto">
                                    <button class="btn btn-outline-secondary" type="button" onclick="alterarQuantidade(${index}, -1)">-</button>
                                    <input type="text" class="form-control text-center bg-light" value="${produto.quantidade}" readonly>
                                    <button class="btn btn-outline-secondary" type="button" onclick="alterarQuantidade(${index}, 1)">+</button>
                                </div>
                            </div>
                            <div class="col-6 col-md-2 text-end fw-bold">
                                ${formatarMoeda(subtotalProduto)}
                            </div>
                            <div class="col-12 col-md-1 text-end text-md-center mt-2 mt-md-0">
                                <button class="btn btn-link text-danger p-0" onclick="removerItem(${index})"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                });
            }

            // Atualiza os valores do resumo à direita
            document.getElementById('resumo-subtotal').innerText = formatarMoeda(valorTotal);
            document.getElementById('resumo-total').innerText = formatarMoeda(valorTotal);
        }

        // Função para aumentar ou diminuir a quantidade
        function alterarQuantidade(index, alteracao) {
            let carrinho = JSON.parse(localStorage.getItem('carrinhoBuittons'));
            
            carrinho[index].quantidade += alteracao;
            
            if (carrinho[index].quantidade < 1) {
                carrinho[index].quantidade = 1; // Não permite quantidade menor que 1
            }
            
            localStorage.setItem('carrinhoBuittons', JSON.stringify(carrinho));
            renderizarCarrinho(); // Redesenha a tela
        }

        // Função para remover um produto do carrinho
        function removerItem(index) {
            let carrinho = JSON.parse(localStorage.getItem('carrinhoBuittons'));
            carrinho.splice(index, 1); // Remove o item da array
            
            localStorage.setItem('carrinhoBuittons', JSON.stringify(carrinho));
            renderizarCarrinho(); // Redesenha a tela
        }
    </script>
</body>
</html>
