<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras | Luis Buittons</title>

    <!--BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!--Links CSS | Favicon -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/font.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="shortcut icon" href="../ims/favinco.ico" type="image/x-icon">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <!-- HEADER PADRÃO DO GRUPO -->
    <header class="header">
        <div class="header-grid">
            <hgroup>
                <a href="../index.html" style="text-decoration: none;"><h1>Luis Buittons</h1></a>
            </hgroup>

            <nav class="nav">
                <div class="nav-links">
                    <ul>
                        <li><a href="../index.html">Início</a></li>
                        <li><a href="../pages/masculino.html">Masculino</a></li>
                        <li><a href="../pages/feminino.html">Feminino</a></li>
                        <li><a href="../pages/acessorios.html">Acessórios</a></li>
                        <li><a href="../pages/sobre.html">Sobre nós</a></li>
                        <li><a href="../pages/contato.html">Contato</a></li>
                    </ul>
                </div>

                <div class="nav-actions">
                    <ul>
                        <li><a href="../pages/carrinho.html" class="text-dark"><i class="fa-solid fa-cart-shopping"></i></a></li>
                        <li><a href="../pages/login.html" class="text-dark"><i class="fa-solid fa-user"></i></a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="container py-5 mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 style="font-family: 'Playfair Display', serif;" class="border-bottom pb-3">Seu Carrinho</h2>
            </div>
        </div>

        <div class="row">
            <!-- LISTA DE PRODUTOS NO CARRINHO (Esquerda) -->
            <div class="col-lg-8 mb-4">
                <div class="card border-0 shadow-sm p-4">
                    <div id="carrinho-vazio" class="text-center py-5 d-none">
                        <i class="fa-solid fa-cart-shopping fa-3x text-muted mb-3"></i>
                        <h5>Seu carrinho está vazio</h5>
                        <p class="text-muted">Adicione produtos para continuar comprando.</p>
                        <a href="../pages/feminino.html" class="btn btn-dark mt-2">Continuar Comprando</a>
                    </div>

                    <div id="lista-produtos"></div> <!-- Arquivos gerados via JS -->
                </div>
            </div>

            <!-- RESUMO DO PEDIDO (Direita) -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 bg-light">
                    <h5 class="mb-4" style="font-family: 'Playfair Display', serif;">Resumo do Pedido</h5>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span id="resumo-subtotal" class="fw-bold">R$ 0,00</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span class="text-muted">Frete (Cortesia)</span>
                        <span class="text-success fw-bold">Grátis</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total</span>
                        <span id="resumo-total" class="fw-bold fs-5">R$ 0,00</span>
                    </div>
                    
                    <!-- Leva para a página da Regina -->
                    <a href="../pages/checkout.html" class="btn btn-dark w-100 text-uppercase py-2" style="letter-spacing: 1px;" id="btn-finalizar">Finalizar Compra</a>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT DO CARRINHO (Lógica do Front-end) -->
    <script src="../assets/js/carrinho.js"></script>
</body>
</html>
